# マウス機能（ポインティングデバイス・スクロール）を有効化
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# ロータリーエンコーダを有効化
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Bluetoothの送信出力を強化（接続安定化）
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# デバイス名の設定（MacやスマホのBluetooth画面に表示される名前）
CONFIG_ZMK_KEYBOARD_NAME="Nothing Mouse"
